services:
  - type: web
    runtime: static
    name: fantasy-web-staging
    autoDeploy: true
    # Inject the staging BFF URL into environment.prod.ts before building.
    # API_URL must be the BFF base origin (no trailing slash, no /api/v1),
    # e.g. https://fantasy-bff-staging.onrender.com
    buildCommand: >-
      npm ci &&
      npm run generate:api &&
      sed -i "s#http://PLACEHOLDER_FOR_PROD_URL#$API_URL#g" src/environments/environment.prod.ts &&
      npm run build
    staticPublishPath: ./dist/fantasy-web/browser
    # SPA: serve index.html for client-side routes (/login, /draft-projection, ...)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        sync: false
