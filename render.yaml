services:
  - type: web
    runtime: static
    name: fantasy-web-staging
    autoDeploy: true
    # Inject build-time config into environment.prod.ts before building:
    #  - API_URL: the BFF base origin (no trailing slash, no /api/v1),
    #    e.g. https://fantasy-bff-staging.onrender.com
    #  - RETRY_TRANSIENT_ERRORS: 'true' on this free-tier staging deploy so the web
    #    waits out cold starts; left unset (→ false) for a real production deploy.
    buildCommand: >-
      npm ci &&
      npm run generate:api &&
      sed -i "s#http://PLACEHOLDER_FOR_PROD_URL#$API_URL#g" src/environments/environment.prod.ts &&
      sed -i "s#__RETRY_TRANSIENT_ERRORS__#${RETRY_TRANSIENT_ERRORS:-false}#g" src/environments/environment.prod.ts &&
      sed -i "s#__GOOGLE_CLIENT_ID__#${GOOGLE_CLIENT_ID:-}#g" src/environments/environment.prod.ts &&
      npm run build
    staticPublishPath: ./dist/fantasy-web/browser
    # SPA: serve index.html for client-side routes (/login, /draft-projection, ...)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Angular 22's CLI requires Node >= 22.22.3; pin the Node 22 line so the
      # Render build doesn't fall back to an older default.
      - key: NODE_VERSION
        value: '22'
      - key: API_URL
        sync: false
      # This staging deploy runs against Render's free tier (services spin down), so
      # retry transient cold-start errors. Omit/false on a real production deploy.
      - key: RETRY_TRANSIENT_ERRORS
        value: 'true'
      # Public Google OAuth Client ID for "Sign in with Google" (not a secret — it is
      # shipped to the browser by design). Empty/unset hides the Google button.
      - key: GOOGLE_CLIENT_ID
        value: 404846934195-2840u7mkdapmstllgsiaft2gdgjb2c0g.apps.googleusercontent.com
