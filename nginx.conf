server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx does NOT inherit `add_header` into a location block that sets any
    # add_header of its own, so these are repeated in the two caching locations below to make sure
    # every response carries them. `always` sends them on error responses too.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy — defined once here and reused on the HTML document below (it only
    # governs the document context, so it isn't needed on the static asset responses). Shipped as
    # Report-Only: it blocks nothing, it only reports violations (open devtools on staging to see
    # them). Once the allowlist is confirmed against the live Google / Facebook / Fonts / headshot
    # flows, flip both Content-Security-Policy-Report-Only headers to Content-Security-Policy.
    set $csp "default-src 'self'; script-src 'self' https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.slapstat.com https://api.staging.slapstat.com https://accounts.google.com https://www.facebook.com https://graph.facebook.com; frame-src https://accounts.google.com https://connect.facebook.net https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    # The structural directives don't affect resource loading, so they are enforced now (the
    # resource allowlist above stays Report-Only until confirmed on staging): no framing
    # (defence-in-depth with X-Frame-Options), no plugins, and a locked-down <base>.
    set $csp_enforce "frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
    add_header Content-Security-Policy-Report-Only $csp always;
    add_header Content-Security-Policy $csp_enforce always;

    # SPA: serve index.html for client-side routes (/login, /projections/:id, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted build assets; never cache index.html.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only $csp always;
        add_header Content-Security-Policy $csp_enforce always;
        add_header Cache-Control "no-cache";
    }
}
