# ---- Link-preview crawlers ----
# Discord, Slack, X, Facebook and friends fetch a shared URL to build the little preview card,
# and none of them run JavaScript. Served the SPA's index.html they would all show the same
# site-wide Open Graph tags, so every shared projection would unfurl identically. These user
# agents get the BFF's per-share preview document instead (see the /s/ location below); real
# browsers are untouched and keep getting the app.
map $http_user_agent $is_link_crawler {
    default                       0;
    "~*discordbot"                1;
    "~*slackbot"                  1;
    "~*twitterbot"                1;
    "~*facebookexternalhit"       1;
    "~*facebookcatalog"           1;
    "~*linkedinbot"               1;
    "~*telegrambot"               1;
    "~*whatsapp"                  1;
    "~*redditbot"                 1;
    "~*skypeuripreview"           1;
    "~*embedly"                   1;
    "~*pinterest"                 1;
    "~*vkshare"                   1;
    "~*bingbot"                   1;
    "~*googlebot"                 1;
    "~*applebot"                  1;
    "~*mastodon"                  1;
    "~*bluesky"                   1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx does NOT inherit `add_header` into a location block that sets any
    # add_header of its own, so these are repeated in the two caching locations below to make sure
    # every response carries them. `always` sends them on error responses too.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy — defined once here and reused on the HTML document below (it only
    # governs the document context, so it isn't needed on the static asset responses). Now ENFORCED,
    # after confirming the allowlist against the live Google / Facebook / Fonts / headshot flows on
    # staging in Report-Only. Allowlist notes: style-src allows accounts.google.com for the Google
    # Sign-In (GSI) stylesheet and 'unsafe-inline' for Angular's injected component styles; img-src
    # allows any https for player headshots, and blob: for the account's own profile picture — that
    # one is fetched with the bearer token an <img> cannot send, so it is drawn from an object URL,
    # and `blob:` is its own scheme rather than something `https:` covers. Without it the picture
    # uploads fine and then silently renders as the initials fallback. The build disables
    # critical-CSS inlining so there is no inline `onload` handler to whitelist (see angular.json
    # optimization.styles.inlineCritical).
    #
    # Paddle is allowed as `https://*.paddle.com` rather than as named hosts, on purpose. Paddle
    # publishes no CSP allowlist, and checkout reaches several of their subdomains that differ
    # between sandbox and live (the script comes from cdn, the checkout iframe and its own calls
    # from others). A missing one does not warn: the checkout simply never appears. The wildcard
    # covers only Paddle's own domain space, which we are already trusting with the payment.
    # Note it does not match `paddle.com` itself, which nothing here loads. Paddle.js also puts
    # its worker on a blob:, which `default-src 'self'` alone would refuse.
    #
    # connect-src names one API: __API_ORIGIN__, replaced at image build time with this build's
    # API_URL (see Dockerfile), the same origin the bundle calls. It used to list both production's
    # and staging's API, so a build given the other environment's API_URL read and wrote that
    # environment's accounts instead of being blocked, and a local image could not reach its own
    # http://localhost:8080. The share-preview and og-image proxies below are nginx's own requests,
    # which the CSP does not govern.
    set $csp "default-src 'self'; script-src 'self' https://accounts.google.com https://connect.facebook.net https://*.paddle.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' __API_ORIGIN__ https://accounts.google.com https://www.facebook.com https://graph.facebook.com https://*.ingest.de.sentry.io https://*.paddle.com; frame-src https://accounts.google.com https://connect.facebook.net https://www.facebook.com https://*.paddle.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;

    # Keeps staging out of search results. The Dockerfile replaces __ROBOTS_TAG__ with "noindex"
    # on any build whose APP_ENV is not "production", and with nothing on production, where nginx
    # then sends no header at all (it skips an add_header whose value is empty). A header rather
    # than a robots.txt Disallow, because a crawler has to fetch a page to learn it must drop it.
    # Repeated in every location below that sets headers of its own, like the ones above.
    set $robots_tag "__ROBOTS_TAG__";
    add_header X-Robots-Tag $robots_tag always;

    # ---- PostHog (EU cloud) reverse proxy ----
    # Analytics is proxied through our own origin so the CSP above stays at 'self' and ad
    # blockers have no third-party host to block (they would otherwise silently remove an
    # unknown share of the very traffic we're trying to count).
    #
    # Runtime DNS via a variable in proxy_pass. A literal hostname is resolved once at config
    # parse time, which would (a) make nginx refuse to START — "host not found in upstream" —
    # if PostHog's DNS is unreachable at boot, taking the whole site down for an analytics
    # dependency, and (b) pin that IP for the container's lifetime even though PostHog sits
    # behind rotating Cloudflare addresses. ipv6=off because these hosts have AAAA records
    # and the Docker bridge has no IPv6 route — an AAAA answer means silent 502s.
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # `^~` is required, not stylistic: without it the regex asset location below
    # (`\.(?:js|css|...)$`) outranks a plain prefix match and would send
    # /ingest/static/array.js to `try_files $uri =404`, leaving PostHog silently broken.
    #
    # A variable in proxy_pass also disables the usual location-prefix stripping, so each
    # path is rebuilt with `rewrite ... break` and proxy_pass carries no URI part (a URI
    # there would *replace* the request URI outright).
    location ^~ /ingest/static/ {
        set $ph_assets eu-assets.i.posthog.com;
        rewrite ^/ingest/static/(.*)$ /static/$1 break;
        proxy_pass https://$ph_assets;
        proxy_set_header Host eu-assets.i.posthog.com;
        # Defaults to off. Without SNI the TLS handshake with Cloudflare fails — a silent 502.
        proxy_ssl_server_name on;
        proxy_ssl_name eu-assets.i.posthog.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ^~ /ingest/array/ {
        set $ph_assets eu-assets.i.posthog.com;
        rewrite ^/ingest/array/(.*)$ /array/$1 break;
        proxy_pass https://$ph_assets;
        proxy_set_header Host eu-assets.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_ssl_name eu-assets.i.posthog.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ^~ /ingest/ {
        set $ph_api eu.i.posthog.com;
        rewrite ^/ingest/(.*)$ /$1 break;
        proxy_pass https://$ph_api;
        proxy_set_header Host eu.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_ssl_name eu.i.posthog.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Load-bearing for the consent design, not just for geo: cookieless identity is a
        # hash of client IP + user agent, so without the real IP every visitor who declines
        # cookies would collapse into a single "person".
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Default is 1m; batched capture payloads can exceed it.
        client_max_body_size 5m;
    }

    # Shared projections. Humans fall through to the SPA like any other client-side route; the
    # crawlers matched above are rewritten to the preview location below. `rewrite ... last`
    # inside `if` is the one form of `if` that is safe in a location (unlike proxy_pass, which
    # misbehaves there) — hence the two-step hop rather than proxying straight from here.
    # Placed before the asset regex location so it wins the regex match.
    location ~ ^/s/[A-Za-z0-9_-]+$ {
        if ($is_link_crawler) {
            rewrite ^/s/(.*)$ /__share-preview/$1 last;
        }
        try_files $uri /index.html;
    }

    # Per-share Open Graph document, proxied from the BFF. __API_ORIGIN__ is replaced with the
    # environment's BFF origin at image build time (see Dockerfile), the same value the browser
    # bundle gets. Runtime DNS via a variable, for the reasons spelled out on the PostHog proxy.
    location ~ ^/__share-preview/(?<share_token>[A-Za-z0-9_-]+)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Robots-Tag $robots_tag always;
        set $bff_origin "__API_ORIGIN__";
        proxy_pass $bff_origin/api/v1/shared/$share_token/preview;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The card a shared link unfurls with, drawn per share by the BFF. It lives on this origin so
    # the Open Graph tags and the image they point at share a host, which means no extra
    # environment variable and no cross-origin fetch for the crawler. Must stay above the static
    # asset location below, which would otherwise claim anything ending in .png and 404 it.
    location ~ ^/s/(?<card_token>[A-Za-z0-9_-]+)/og-image\.png$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag $robots_tag always;
        set $bff_card_origin "__API_ORIGIN__";
        proxy_pass $bff_card_origin/api/v1/shared/$card_token/og-image.png;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve index.html for client-side routes (/login, /projections/:id, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the build's scripts and styles: each carries a content hash in its name
    # (outputHashing "all" in angular.json), so a new build is a new URL. Never cache index.html.
    location ~* \.(?:js|css)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag $robots_tag always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images, icons and fonts come from public/ under names that never change (favicon.ico, the
    # app icons, the logos, og-image.png). A year's immutable cache kept a replaced icon from
    # reaching anyone who had visited before, so these get a day and are then fetched again.
    location ~* \.(?:woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag $robots_tag always;
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Robots-Tag $robots_tag always;
        add_header Cache-Control "no-cache";
        # nginx refuses a POST to a static file with 405. An automated site check that POSTed to
        # / (see DECISIONS.md, 2026-09-14) read that as a site that does not work, so a POST to any
        # page gets the page, as a GET would. The redirect error_page makes is a GET.
        error_page 405 =200 $uri;
    }
}
