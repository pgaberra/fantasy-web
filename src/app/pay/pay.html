<section class="pay">
  @if (failed()) {
    <h1 class="pay__title">Checkout could not be opened</h1>
    <p class="pay__text">
      Something went wrong on the way to the payment window. Nothing has been charged.
    </p>
    <a routerLink="/pricing" class="btn btn-primary">Back to pricing</a>
  } @else {
    <h1 class="pay__title">Opening secure checkout</h1>
    <p class="pay__text">This takes a moment. Please do not close this page.</p>
  }
</section>
