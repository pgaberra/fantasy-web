<app-environment-banner [environmentName]="environmentName" [version]="appVersion" />
@if (!isLandingRoute()) {
  <header class="app-header">
    <div class="app-header-inner">
      <a routerLink="/" class="app-logo" aria-label="SlapStat home">
        <img src="slapstat-logo.png" alt="SlapStat" />
      </a>
      <nav class="app-nav">
        @if (authService.isLoggedIn()) {
          <button
            type="button"
            class="nav-trigger"
            [class.active]="isDraftSection()"
            [cdkMenuTriggerFor]="draftMenu"
          >
            Draft
            <svg
              class="nav-caret"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          <a routerLink="/whos-hot" routerLinkActive="active">Who's hot</a>
          @if (paymentsEnabled) {
            <a routerLink="/account" routerLinkActive="active">Account</a>
          }
          @if (authService.isAdmin()) {
            <a routerLink="/admin" routerLinkActive="active">Admin</a>
          }
          <button class="btn-logout" (click)="authService.logout()">Sign Out</button>
        } @else {
          <a routerLink="/login" routerLinkActive="active">Sign In</a>
        }
      </nav>
    </div>
  </header>
}
<ng-template #draftMenu>
  <div class="nav-menu" cdkMenu>
    <a
      class="nav-menu-item"
      cdkMenuItem
      routerLink="/draft"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      >Draft Mode</a
    >
    <a
      class="nav-menu-item"
      cdkMenuItem
      routerLink="/projections"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      My Projections
    </a>
  </div>
</ng-template>
<app-unverified-banner />
<main class="app-main">
  <router-outlet />
</main>
<app-toast />
<app-consent-banner />
