<app-environment-banner [environmentName]="environmentName" [version]="appVersion" />
@if (!isLandingRoute()) {
  <header class="app-header">
    <div class="app-header-inner">
      <a routerLink="/" class="app-logo" aria-label="SlapStat home">
        <img src="slapstat-logo.png" alt="SlapStat" />
      </a>
      <nav class="app-nav">
        @if (authService.isLoggedIn()) {
          <a routerLink="/projections" routerLinkActive="active">My projections</a>
          <button class="btn-logout" (click)="authService.logout()">Sign Out</button>
        } @else {
          <a routerLink="/login" routerLinkActive="active">Sign In</a>
        }
      </nav>
    </div>
  </header>
}
<main class="app-main">
  <router-outlet />
</main>
