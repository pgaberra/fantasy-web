<app-environment-banner [environmentName]="environmentName" [version]="appVersion" />
@if (!isLandingRoute()) {
  <header class="app-header">
    <div class="app-header-inner">
      <a routerLink="/" class="app-logo" aria-label="SlapStat home">
        <img src="slapstat-logo.png" alt="SlapStat" />
      </a>
      <nav class="app-nav">
        @if (authService.isLoggedIn()) {
          <button type="button" class="nav-burger" aria-label="Menu" [cdkMenuTriggerFor]="navMenu">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <line x1="4" y1="7" x2="20" y2="7" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="17" x2="20" y2="17" />
            </svg>
          </button>
          <button
            type="button"
            class="nav-trigger"
            [class.active]="isDraftSection()"
            [cdkMenuTriggerFor]="navMenu"
          >
            Draft
            <svg
              class="nav-caret"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          <a routerLink="/whos-hot" routerLinkActive="active">Who's hot</a>
          @if (paymentsEnabled) {
            <a routerLink="/account" routerLinkActive="active">Account</a>
          }
          @if (authService.isAdmin()) {
            <a routerLink="/admin" routerLinkActive="active">Admin</a>
          }
          <button class="btn-logout" (click)="authService.logout()">Sign Out</button>
        } @else {
          <a routerLink="/login" routerLinkActive="active">Sign In</a>
        }
      </nav>
    </div>
  </header>
}
<ng-template #navMenu>
  <div class="nav-menu" cdkMenu>
    <a
      class="nav-menu-item"
      cdkMenuItem
      routerLink="/draft"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      >Draft Mode</a
    >
    <a
      class="nav-menu-item"
      cdkMenuItem
      routerLink="/projections"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      My Projections
    </a>
    <a
      class="nav-menu-item nav-menu-item--collapsed"
      cdkMenuItem
      routerLink="/whos-hot"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      Who's hot
    </a>
    @if (paymentsEnabled) {
      <a
        class="nav-menu-item nav-menu-item--collapsed"
        cdkMenuItem
        routerLink="/account"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        Account
      </a>
    }
    @if (authService.isAdmin()) {
      <a
        class="nav-menu-item nav-menu-item--collapsed"
        cdkMenuItem
        routerLink="/admin"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        Admin
      </a>
    }
    <button
      type="button"
      class="nav-menu-item nav-menu-item--collapsed nav-menu-item--signout"
      cdkMenuItem
      (click)="authService.logout()"
    >
      Sign Out
    </button>
  </div>
</ng-template>
<app-unverified-banner />
<main class="app-main">
  <router-outlet />
</main>
<app-toast />
<app-consent-banner />
