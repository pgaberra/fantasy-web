<!-- Which games, and how to count them. Which season is not asked here: it frames the whole
     page rather than this row, so it is asked once, up beside the page title. -->
<section class="range-bar" aria-label="Game range and scoring options">
  <!-- The pills and the rail are one question asked twice over — by name, then exactly — so
       they are one group under one label rather than two rows that happen to sit together. -->
  <div class="range-group" role="group" aria-labelledby="whos-hot-range-label">
    <div class="range-field">
      <span class="field-label" id="whos-hot-range-label">Game range</span>
      <div class="presets">
        @for (preset of presets; track preset.label) {
          <button
            type="button"
            class="preset"
            [class.preset--active]="isPresetActive()(preset)"
            [attr.aria-pressed]="isPresetActive()(preset)"
            [disabled]="isPresetLocked()(preset)"
            (click)="applyPreset(preset)"
          >
            {{ preset.label }}
          </button>
        }

        <!-- Sits at the end of the row it explains, so the flat pills beside it are never a
             mystery: they are off because of this, and this is the way to turn them on. -->
        @if (locked()) {
          <a class="premium-lock premium-badge" routerLink="/premium">
            <app-icon name="lock" [size]="13" />
            Premium
          </a>
          <app-help-tip
            label="Why the other ranges are off"
            text="Unlock custom game ranges with Premium."
          />
        }
      </div>
    </div>

    <div class="range-slider">
      <input
        class="game-number"
        type="number"
        min="1"
        [max]="scheduleLength()"
        step="1"
        [value]="fromGame()"
        aria-label="First game in the range"
        [disabled]="locked()"
        (input)="onFromInput($event)"
      />
      <div class="track" [class.track--locked]="locked()" (pointermove)="onTrackHover($event)">
        <div class="track-rail" aria-hidden="true"></div>
        <div class="track-fill" aria-hidden="true" [style]="fillStyle()"></div>
        <input
          class="thumb"
          [class.thumb--on-top]="activeThumb() === 'from'"
          type="range"
          min="1"
          [max]="scheduleLength()"
          step="1"
          [value]="fromGame()"
          aria-label="Drag to set the first game in the range"
          [attr.aria-valuetext]="'Game ' + fromGame()"
          [disabled]="locked()"
          (input)="onFromInput($event)"
        />
        <input
          class="thumb"
          [class.thumb--on-top]="activeThumb() === 'to'"
          type="range"
          min="1"
          [max]="scheduleLength()"
          step="1"
          [value]="toGame()"
          aria-label="Drag to set the last game in the range"
          [attr.aria-valuetext]="'Game ' + toGame()"
          [disabled]="locked()"
          (input)="onToInput($event)"
        />
      </div>
      <input
        class="game-number"
        type="number"
        min="1"
        [max]="scheduleLength()"
        step="1"
        [value]="toGame()"
        aria-label="Last game in the range"
        [disabled]="locked()"
        (input)="onToInput($event)"
      />
      <span class="range-summary">{{ summary() }}</span>
    </div>
  </div>

  <div class="range-options">
    <div class="option">
      <button
        type="button"
        class="switch"
        role="switch"
        [attr.aria-checked]="perGame()"
        (click)="togglePerGame()"
      >
        <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
        Per game
      </button>
      <app-help-tip label="What per game does" text="Display stats on a per-game basis." />
    </div>

    <!-- The minimum only means something once the leaderboard is scored per game: a rate off two
         games is the thing it guards against, while in totals mode a player who barely played
         already shows small totals and sorts himself to the bottom. Shown next to the switch that
         gives it a job, and not applied while that switch is off, so the number on screen is
         always a filter that is actually running. -->
    @if (perGame()) {
      <div class="option min-games">
        <label for="min-games">Min. games</label>
        <app-help-tip
          label="What the minimum does"
          text="Hide players with fewer appearances than this minimum."
        />
        <input
          id="min-games"
          type="number"
          min="1"
          [max]="spanLength()"
          step="1"
          [value]="minGames()"
          (input)="onMinGamesInput($event)"
        />
      </div>
    }
  </div>
</section>
