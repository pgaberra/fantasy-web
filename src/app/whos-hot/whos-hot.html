<div class="whos-hot">
  <div class="page-header">
    <h1>Who's hot</h1>
    <p class="subtitle">
      Pick a stretch of the {{ seasonLabel }} season and see who actually produced over it —
      measured totals, scored the way your league scores.
    </p>
  </div>

  <app-game-range-selector
    [seasonLabel]="seasonLabel"
    [scheduleLength]="scheduleLength"
    [(fromGame)]="fromGame"
    [(toGame)]="toGame"
    [(perGame)]="perGame"
    [(minGames)]="minGames"
  />

  @if (hasError()) {
    <app-error-state title="Couldn't load the leaderboard" (retry)="retry()" />
  } @else if (isLoading()) {
    <app-loading-indicator />
  } @else {
    <app-hot-players-table
      [hotPlayers]="hotPlayers()"
      [players]="players()"
      [activeColumns]="activeColumns()"
      [(scoringType)]="scoringType"
      [(statWeights)]="statWeights"
      [(activeScoringColumns)]="activeScoringColumns"
      [(activeUtilityColumns)]="activeUtilityColumns"
      [(leagueSize)]="leagueSize"
      [(rosterSlots)]="rosterSlots"
      [(minGoalieGames)]="minGoalieGames"
      [syncedLeagueName]="syncedLeagueName()"
      [perGame]="perGame()"
      [minGames]="minGames()"
      (manageSyncRequested)="showSyncDialog.set(true)"
    >
      <!-- The same slot says two different things. With no league yet, importing one is the
           fastest way to have the leaderboard scored the way it will actually count for you, so
           it earns the toolbar's only primary button. Once there is one, the button stops asking
           and starts reporting — same place, same dialog behind it. -->
      @if (syncedLeagueName(); as leagueName) {
        <button
          table-toolbar-actions
          type="button"
          class="btn btn-secondary btn-sm synced-league"
          [appTooltip]="'Imported from ' + leagueName + ' — click to re-sync or change league'"
          (click)="showSyncDialog.set(true)"
        >
          <span class="synced-dot" aria-hidden="true"></span>
          @switch (syncedProvider()) {
            @case ('espn') {
              <img class="synced-mark synced-mark--espn" src="espn-logo.png" alt="" />
            }
            @case ('yahoo') {
              <svg
                class="synced-mark synced-mark--yahoo"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M18.86 1.56L14.27 11.87H19.4L24 1.56H18.86M0 6.71L5.15 18.27L3.3 22.44H7.83L14.69 6.71H10.19L7.39 13.44L4.62 6.71H0M15.62 12.87C13.95 12.87 12.71 14.12 12.71 15.58C12.71 17 13.91 18.19 15.5 18.19C17.18 18.19 18.43 16.96 18.43 15.5C18.43 14.03 17.23 12.87 15.62 12.87Z"
                />
              </svg>
            }
          }
          <span class="synced-label">Synced with {{ leagueName }}</span>
        </button>
      } @else {
        <button
          table-toolbar-actions
          type="button"
          class="btn btn-primary btn-sm"
          (click)="showSyncDialog.set(true)"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-7.5-4M3 12a9 9 0 0 1 9-9 9 9 0 0 1 7.5 4" />
            <path d="M21 3v5h-5M3 21v-5h5" />
          </svg>
          Import league
        </button>
      }
    </app-hot-players-table>
  }

  @if (showSyncDialog()) {
    <app-league-sync-dialog (closed)="showSyncDialog.set(false)">
      <app-league-sync
        [lastSync]="yahooSync()"
        [lastEspnLeagueId]="lastEspnLeagueId()"
        [lastEspnSyncedAt]="espnSync()?.syncedAt ?? null"
        [lastEspnLeagueName]="espnSync()?.leagueName ?? null"
        (yahooSynced)="applyYahooSettings($event)"
        (espnSynced)="applyEspnSettings($event)"
      />
    </app-league-sync-dialog>
  }
</div>
