<div class="whos-hot">
  <div class="page-header">
    <h1>Who's Hot</h1>

    <!-- Beside the title rather than down in the range bar, because that is what it is: the
         season frames every number on the page, not just the stretch of games picked below it.
         In the bar it was one short column next to a two-line one, which left a hole under it
         the width of the field and the height of the rail. -->
    <div class="season-field">
      <label class="season-label" for="whos-hot-season">Season</label>
      <select id="whos-hot-season" class="season-select" (change)="onSeasonChange($event)">
        @for (option of seasons; track option.startYear) {
          <option [value]="option.startYear" [selected]="option.startYear === season()">
            {{ option.label }}
          </option>
        }
      </select>
    </div>
  </div>

  <!-- One card, not two. Choosing the games, choosing how they are scored and reading the
       result are three steps of the same question, and the range panel used to sit in its own
       narrower panel above — a second heading, a second border and a ragged right edge, all to
       separate a control from the only thing it controls. The card is drawn here rather than
       inside the table so the loading and error states land inside it too, and the range stays
       put instead of the page reflowing around it on every reload. -->
  <div class="leaderboard-card">
    <!-- Nothing to rank by until there is a league: "best" only means something in the way a
         league scores, and the page takes that from the league rather than asking the user to
         copy it in. So, as on the Streamer Planner, the card asks for one first. -->
    @if (!syncedLeagueName()) {
      <div class="league-prompt">
        <app-icon name="link" [size]="48" class="league-prompt-icon" />
        <p class="league-prompt-title">Sync your league</p>
        <button type="button" class="btn btn-primary" (click)="showSyncDialog.set(true)">
          Sync league
        </button>
      </div>
    } @else {
      <!-- Drawn once the season's own length is known: 82 games in 2025-26, 84 in 2026-27. -->
      @if (scheduleLength(); as scheduleLength) {
        <app-game-range-selector
          [scheduleLength]="scheduleLength"
          [latestGame]="latestGame() ?? scheduleLength"
          [locked]="!canPickRange()"
          [(fromGame)]="fromGame"
          [(toGame)]="toGame"
          [(lastGames)]="lastGames"
          [(seasonSpan)]="seasonSpan"
          [(perGame)]="perGame"
          [(minGames)]="minGames"
        />
      }

      <app-hot-players-table
        [rowsPending]="isLoading() || hasError()"
        [hotPlayers]="hotPlayers()"
        [players]="players()"
        [seasonLabel]="seasonLabel()"
        [activeColumns]="activeColumns()"
        [scoringType]="scoringType()"
        [(statWeights)]="statWeights"
        [leagueSize]="leagueSize()"
        [rosterSlots]="rosterSlots()"
        [minGoalieGames]="minGoalieGames()"
        [syncedLeagueName]="syncedLeagueName()"
        [perGame]="perGame()"
        [minGames]="appliedMinGames()"
        [availableFilter]="canShowAvailableOnly()"
        [(availableOnly)]="availableOnly"
        [rosteredPlayerIds]="rosteredPlayerIds()"
      >
        <!-- The league the board is scored by, and the way to re-sync, change or disconnect it. -->
        <app-league-import-button
          table-toolbar-actions
          [yahooSync]="yahooSync()"
          [espnSync]="espnSync()"
          (pressed)="showSyncDialog.set(true)"
        />
        <!-- In place of the rows, not the table: a new range is a new fetch, and the table holds
           the position, team and search filters and the sort. Swapping the whole table for a
           spinner rebuilt it on every range change and put all of them back to their defaults. -->
        <div table-status>
          @if (hasError()) {
            <app-error-state
              title="Couldn't load the leaderboard"
              [error]="loadFailure()"
              (retry)="retry()"
            />
          } @else {
            <app-loading-indicator />
          }
        </div>
      </app-hot-players-table>
    }
  </div>

  @if (showSyncDialog()) {
    <app-league-sync-dialog (closed)="showSyncDialog.set(false)">
      <app-league-sync
        [lastSync]="yahooSync()"
        [openOnYahoo]="backFromYahoo"
        [lastEspnLeagueId]="lastEspnLeagueId()"
        [lastEspnSyncedAt]="espnSync()?.syncedAt ?? null"
        [lastEspnLeagueName]="espnSync()?.leagueName ?? null"
        (yahooSynced)="applyYahooSettings($event)"
        (espnSynced)="applyEspnSettings($event)"
        (disconnected)="disconnectLeague($event)"
      />
    </app-league-sync-dialog>
  }
</div>
