<div class="since" role="group" aria-label="The projection to compare with">
  <button
    type="button"
    class="segment"
    [class.segment--active]="!on()"
    [attr.aria-pressed]="!on()"
    (click)="pickOff()"
  >
    Off
  </button>
  <button
    type="button"
    class="segment"
    [class.segment--active]="on() && since() === null"
    [attr.aria-pressed]="on() && since() === null"
    (click)="pickPreseason()"
  >
    Preseason
  </button>
  <label class="segment date-field" [class.segment--active]="on() && since() !== null">
    <span class="date-label">a day</span>
    <input
      class="field-date"
      type="date"
      aria-label="A day to compare with"
      [min]="earliest()"
      [max]="latest()"
      [value]="since() ?? ''"
      (focus)="pickDay()"
      (change)="onDate($event)"
    />
  </label>
</div>
