<div class="since" role="group" aria-label="The projection to compare with">
  <button
    type="button"
    class="pill"
    [class.pill--active]="since() === null"
    [attr.aria-pressed]="since() === null"
    (click)="pickPreseason()"
  >
    Preseason
  </button>
  <label class="pill date-field" [class.pill--active]="since() !== null">
    <span class="date-label">{{
      since() === null ? 'or the projection of' : 'the projection of'
    }}</span>
    <input
      class="field-date"
      type="date"
      aria-label="A day to compare with"
      [min]="earliest()"
      [max]="latest()"
      [value]="since() ?? ''"
      (focus)="pickDay()"
      (change)="onDate($event)"
    />
  </label>
</div>
@if (caption()) {
  <p class="since-caption" aria-live="polite">{{ caption() }}</p>
}
