@if (isLoading()) {
  <app-loading-indicator />
} @else if (loadError()) {
  <app-error-state
    title="Couldn't load the page"
    message="We couldn't load your player data. Check your connection and try again."
    (retry)="retryLoad()"
  />
} @else {
  <div class="projection-create">
    <div class="page-header">
      <a routerLink="/projections" class="back-link">← My projections</a>
      <h1>New projection</h1>
    </div>

    <div class="field">
      <label for="projection-name">Name</label>
      <input
        id="projection-name"
        type="text"
        maxlength="100"
        placeholder="Projection name"
        [value]="name()"
        (input)="onNameInput($event)"
        (focus)="onNameFocus($event)"
      />
    </div>

    <div class="field">
      <span class="field-label">Starting point</span>
      <p class="field-hint">Initial stats for each player</p>
      <div class="radio-group">
        <div class="radio-row">
          <label class="radio-option">
            <input
              type="radio"
              name="data-source"
              [checked]="dataSource() === 'last-season'"
              (change)="dataSource.set('last-season')"
            />
            <span class="radio-title">Last season's stats</span>
          </label>
          <app-help-tip
            label="What starting from last season's stats means"
            text="Start from each player's real numbers from last season."
          />
        </div>
        <div class="radio-row">
          <label class="radio-option">
            <input
              type="radio"
              name="data-source"
              [checked]="dataSource() === 'blank'"
              (change)="dataSource.set('blank')"
            />
            <span class="radio-title">From scratch</span>
          </label>
          <app-help-tip label="What starting from scratch means" text="Every stat starts at 0." />
        </div>
        @if (existingProjections().length) {
          <div class="radio-row">
            <label class="radio-option">
              <input
                type="radio"
                name="data-source"
                [checked]="dataSource() === 'copy'"
                (change)="dataSource.set('copy')"
              />
              <span class="radio-title">A copy of another projection</span>
            </label>
            <app-help-tip
              label="What copying another projection means"
              text="Base your projection on a current one."
            />
          </div>
        }
      </div>
      @if (dataSource() === 'copy') {
        <select
          class="copy-select"
          [value]="copyFromId() ?? ''"
          (change)="onCopyFromChange($event)"
        >
          <option value="">Choose a projection…</option>
          @for (projection of existingProjections(); track projection.id) {
            <option [value]="projection.id">{{ projection.name }} ({{ projection.season }})</option>
          }
        </select>
      }
    </div>

    <p class="settings-note">Scoring, roster and stat settings are configured in the editor.</p>

    <button
      type="button"
      class="create-button btn btn-primary btn-lg"
      [disabled]="!canCreate()"
      (click)="create()"
    >
      {{ isCreating() ? 'Creating…' : 'Create projection' }}
    </button>
  </div>
}
