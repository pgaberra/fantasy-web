@if (isLoggedIn() && !isEmailVerified()) {
  <div class="unverified-banner" role="status">
    @if (sent()) {
      <span class="unverified-banner__text">
        Verification email sent — check your inbox (and your spam folder).
      </span>
    } @else {
      <span class="unverified-banner__text">
        Please verify your email to secure your account.
      </span>
      <button
        type="button"
        class="unverified-banner__button"
        (click)="resend()"
        [disabled]="isSending()"
      >
        @if (isSending()) {
          <span>Sending<span class="loading-dots" aria-hidden="true"></span></span>
        } @else {
          Resend email
        }
      </button>
      @if (failed()) {
        <span class="unverified-banner__error">Couldn't send — please try again.</span>
      }
    }
  </div>
}
