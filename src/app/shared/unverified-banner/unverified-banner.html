@if (isLoggedIn() && !isEmailVerified()) {
  <div class="unverified-banner" role="status">
    <app-icon name="mail" class="unverified-banner__icon" />
    @if (sent()) {
      <span class="unverified-banner__text">
        Verification email sent. Check your inbox or spam folder.
      </span>
    } @else {
      <span class="unverified-banner__text">Please verify your email.</span>
      <button
        type="button"
        class="unverified-banner__button"
        (click)="resend()"
        [disabled]="isSending()"
      >
        @if (isSending()) {
          <app-loading-indicator variant="inline" label="Sending" />
        } @else {
          Resend email
        }
      </button>
      @if (failed()) {
        <span class="unverified-banner__error">Couldn't send the verification email.</span>
      }
    }
  </div>
}
