@if (enabled) {
  @if (label(); as text) {
    <span class="import-label">{{ text }}</span>
  }
  <button
    type="button"
    class="btn btn-secondary btn-sm"
    [disabled]="loadingPlayers()"
    (click)="open()"
  >
    @if (loadingPlayers()) {
      <app-loading-indicator variant="inline" label="Loading players" />
    } @else {
      <span class="spreadsheet-icon"><app-icon name="spreadsheet" /></span>
      Import a spreadsheet
    }
  </button>

  @if (dialogOpen() && players(); as pool) {
    <app-spreadsheet-import-dialog
      [players]="pool"
      [saving]="saving()"
      [saveError]="saveError()"
      (imported)="save($event)"
      (closed)="close()"
    />
  }
}
