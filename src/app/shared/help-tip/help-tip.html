<button
  #tip="appTooltip"
  type="button"
  class="help-trigger"
  [appTooltip]="text()"
  [dismissOnClick]="false"
  [attr.aria-label]="label()"
  (click)="tip.toggle()"
>
  <svg
    viewBox="0 0 24 24"
    width="14"
    height="14"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="10" />
    <path d="M12 16v-4" />
    <path d="M12 8h.01" />
  </svg>
</button>
