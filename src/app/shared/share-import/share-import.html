<form class="import" (ngSubmit)="submit()">
  <label class="import-label" for="share-link">{{ label() }}</label>
  <div class="import-controls">
    <input
      id="share-link"
      type="text"
      class="import-input"
      placeholder="Paste a share link"
      autocomplete="off"
      maxlength="200"
      [value]="shareInput()"
      (input)="onInput($any($event.target).value)"
    />
    @if (importName() !== null) {
      <input
        type="text"
        class="import-input"
        placeholder="Name this copy"
        autocomplete="off"
        maxlength="100"
        [value]="importName()"
        (input)="importName.set($any($event.target).value)"
      />
    }
    @if (showSubmit()) {
      <button type="submit" class="btn btn-primary btn-sm" [disabled]="isImporting() || !hasLink()">
        {{ isImporting() ? 'Importing…' : 'Import' }}
      </button>
    }
  </div>
  @if (importHint()) {
    <p class="import-hint">{{ importHint() }}</p>
  }
</form>
