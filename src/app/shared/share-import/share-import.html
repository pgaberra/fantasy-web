<form class="import" (submit)="onSubmit($event)" novalidate>
  <label class="import-label" for="share-link">{{ label() }}</label>
  <div class="import-controls">
    <input
      id="share-link"
      type="text"
      class="import-input"
      placeholder="e.g. slapstat.com/s/abc123"
      autocomplete="off"
      maxlength="200"
      [value]="shareInput()"
      (input)="shareInput.set($any($event.target).value)"
    />
    <!-- Secondary: the page's own button (Create projection, Start draft) is the one filled button
         on it. Two filled buttons, both greyed out before anything is picked, gave no clue which
         one was the next step. -->
    <button
      type="submit"
      class="btn btn-secondary btn-sm"
      [disabled]="isImporting() || shareInput().trim().length === 0"
    >
      @if (isImporting()) {
        <app-loading-indicator variant="inline" label="Importing" />
      } @else {
        Import
      }
    </button>
  </div>
  @if (importHint()) {
    <p class="import-hint" [class.import-hint--note]="hintIsNote()" role="status">
      {{ importHint() }}
    </p>
  }
</form>
