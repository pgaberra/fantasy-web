<form class="import" (submit)="onSubmit($event)" novalidate>
  <label class="import-label" for="share-link">{{ label() }}</label>
  <div class="import-controls">
    <input
      id="share-link"
      type="text"
      class="import-input"
      placeholder="e.g. slapstat.com/s/abc123"
      autocomplete="off"
      maxlength="200"
      [value]="shareInput()"
      (input)="shareInput.set($any($event.target).value)"
    />
    @if (importName() !== null) {
      <input
        type="text"
        class="import-input"
        placeholder="Name this copy"
        autocomplete="off"
        maxlength="100"
        [value]="importName()"
        (input)="importName.set($any($event.target).value)"
      />
    }
    <button
      type="submit"
      class="btn btn-primary btn-sm"
      [disabled]="isImporting() || shareInput().trim().length === 0"
    >
      @if (isImporting()) {
        <app-loading-indicator variant="inline" label="Importing" />
      } @else {
        Import
      }
    </button>
  </div>
  @if (importHint()) {
    <p class="import-hint">{{ importHint() }}</p>
  }
</form>
