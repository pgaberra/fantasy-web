@if (show) {
  <aside class="offseason-notice" role="note">
    <span class="offseason-notice__icon" aria-hidden="true">ⓘ</span>
    <div class="offseason-notice__body">
      <p class="offseason-notice__title">Player data is paused for the off-season</p>
      <ul class="offseason-notice__list">
        <li>
          Team affiliations may be out of date — off-season trades and signings aren't reflected
          yet.
        </li>
        <li>Newly drafted rookies aren't in the player list yet.</li>
      </ul>
      <p class="offseason-notice__footer">
        Both refresh automatically once the new NHL season opens on Yahoo.
      </p>
    </div>
  </aside>
}
