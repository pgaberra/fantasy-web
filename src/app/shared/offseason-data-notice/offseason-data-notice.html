@if (show) {
  <aside class="offseason-notice" role="note">
    <span class="offseason-notice__icon">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4" />
        <path d="M12 8h.01" />
      </svg>
    </span>
    <div class="offseason-notice__body">
      <p class="offseason-notice__title">It's the NHL off-season</p>
      <ul class="offseason-notice__list">
        <li>Team affiliations may be out of date. Off-season trades and signings aren't in yet.</li>
        <li>Most rookies aren't in the player list yet.</li>
      </ul>
      <p class="offseason-notice__footer">This updates when the new season opens.</p>
    </div>
  </aside>
}
