@if (show) {
  <aside class="offseason-notice" role="note">
    <span class="offseason-notice__icon">
      <app-icon name="info" />
    </span>
    <div class="offseason-notice__body">
      <p class="offseason-notice__title">It's the NHL off-season</p>
      <ul class="offseason-notice__list">
        <li>
          Team affiliations may be out of date. Off-season trades and signings aren't reflected yet.
        </li>
        <li>Most rookies aren't in the player list yet.</li>
      </ul>
      <p class="offseason-notice__footer">
        Player and team data will update automatically when the new season starts.
      </p>
    </div>
  </aside>
}
