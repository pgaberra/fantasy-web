@if (show) {
  <aside class="offseason-notice" role="note">
    <span class="offseason-notice__icon">
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4" />
        <path d="M12 8h.01" />
      </svg>
    </span>
    <div class="offseason-notice__body">
      <p class="offseason-notice__title">Off-season data</p>
      <p class="offseason-notice__text">
        Team affiliations lag trades and signings, and most rookies aren't listed yet.
      </p>
      <p class="offseason-notice__footer">This updates when the season opens.</p>
    </div>
  </aside>
}
