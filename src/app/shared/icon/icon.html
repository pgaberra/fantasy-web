<!--
  One `<svg>` for every icon: the grid, the stroke and the caps are set here once, and each case
  contributes only the shape. Geometry follows Lucide, except where the app's own drawing was
  already correct 24-grid Lucide geometry, which is kept so this change fixes the icons that were
  wrong rather than restyling the ones that were right.
-->
<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('alert-triangle') {
      <path
        d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"
      />
      <path d="M12 9v4" />
      <path d="M12 17h.01" />
    }
    @case ('arrow-up-to-line') {
      <path d="M5 4h14" />
      <path d="m8 13 4-4 4 4" />
      <path d="M12 20V9" />
    }
    @case ('chart-bar') {
      <path d="M3 3v16a2 2 0 0 0 2 2h16" />
      <path d="M8 17v-3" />
      <path d="M13 17V9" />
      <path d="M18 17V5" />
    }
    @case ('chart-columns') {
      <path d="M6 20v-4" />
      <path d="M12 20V10" />
      <path d="M18 20V4" />
    }
    @case ('check') {
      <path d="M20 6 9 17l-5-5" />
    }
    @case ('check-circle') {
      <circle cx="12" cy="12" r="10" />
      <path d="m9 12 2 2 4-4" />
    }
    @case ('chevron-down') {
      <path d="m6 9 6 6 6-6" />
    }
    @case ('chevron-right') {
      <path d="m9 18 6-6-6-6" />
    }
    @case ('clipboard-list') {
      <rect x="8" y="2" width="8" height="4" rx="1" />
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
      <path d="M12 11h4" />
      <path d="M12 16h4" />
      <path d="M8 11h.01" />
      <path d="M8 16h.01" />
    }
    @case ('close') {
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    }
    @case ('columns') {
      <rect x="3" y="3" width="18" height="18" rx="2" />
      <path d="M9 3v18" />
      <path d="M15 3v18" />
    }
    @case ('grip-vertical') {
      <circle cx="9" cy="5" r="1" />
      <circle cx="9" cy="12" r="1" />
      <circle cx="9" cy="19" r="1" />
      <circle cx="15" cy="5" r="1" />
      <circle cx="15" cy="12" r="1" />
      <circle cx="15" cy="19" r="1" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <path d="M12 8h.01" />
    }
    @case ('link') {
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
    }
    @case ('lock') {
      <rect x="3" y="11" width="18" height="11" rx="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    }
    @case ('menu') {
      <path d="M4 6h16" />
      <path d="M4 12h16" />
      <path d="M4 18h16" />
    }
    @case ('more-vertical') {
      <circle cx="12" cy="5" r="1" />
      <circle cx="12" cy="12" r="1" />
      <circle cx="12" cy="19" r="1" />
    }
    @case ('pencil') {
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
    }
    @case ('play') {
      <path d="m6 3 14 9-14 9Z" />
    }
    @case ('redo') {
      <path d="m15 14 5-5-5-5" />
      <path d="M20 9H9.5A5.5 5.5 0 0 0 9.5 20H13" />
    }
    @case ('refresh') {
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
      <path d="M21 3v5h-5" />
      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
      <path d="M8 16H3v5" />
    }
    @case ('rotate-ccw') {
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
      <path d="M3 3v5h5" />
    }
    @case ('share') {
      <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
      <path d="m16 6-4-4-4 4" />
      <path d="M12 2v13" />
    }
    @case ('sliders') {
      <path d="M4 21v-7" />
      <path d="M4 10V3" />
      <path d="M12 21v-9" />
      <path d="M12 8V3" />
      <path d="M20 21v-5" />
      <path d="M20 12V3" />
      <path d="M2 14h4" />
      <path d="M10 8h4" />
      <path d="M18 16h4" />
    }
    @case ('sparkles') {
      <path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z" />
      <path d="M18.5 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" />
    }
    @case ('table') {
      <rect x="3" y="3" width="18" height="18" rx="2" />
      <path d="M3 9h18" />
      <path d="M3 15h18" />
      <path d="M12 3v18" />
    }
    @case ('trash') {
      <path d="M3 6h18" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
    }
    @case ('undo') {
      <path d="M9 14 4 9l5-5" />
      <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
    }
  }
</svg>
