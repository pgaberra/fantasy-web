<div class="card-main">
  <span class="card-name">{{ projection().name }}</span>
  <span class="card-meta"
    >{{ projection().season }} · Updated {{ projection().updatedAt | relativeTime }}</span
  >
</div>
<div class="card-actions">
  @if (confirmingDelete()) {
    <span class="confirm-text">Delete “{{ projection().name }}”?</span>
    <button type="button" class="delete" (click)="confirmDelete()">Yes, delete</button>
    <button type="button" class="cancel" (click)="cancelDelete()">Cancel</button>
  } @else {
    <button type="button" class="edit" (click)="edit.emit()">Edit</button>
    <button type="button" class="delete" (click)="startDelete()">Delete</button>
  }
</div>
