<div class="card-main">
  <span class="card-name">{{ projection().name }}</span>
  <span class="card-meta">Updated {{ projection().updatedAt | relativeTime }}</span>
  @if (projection().draftStatus === 'finished') {
    <span class="card-status card-status--done">Draft complete</span>
  } @else if (projection().draftStatus === 'in_progress') {
    <span class="card-status">Draft in progress</span>
  }
</div>
<div class="card-actions">
  @if (confirmingDelete()) {
    <span class="confirm-text">Delete “{{ projection().name }}”?</span>
    <button type="button" class="btn btn-danger btn-sm delete" (click)="confirmDelete()">
      Yes, delete
    </button>
    <button type="button" class="btn btn-secondary btn-sm cancel" (click)="cancelDelete()">
      Cancel
    </button>
  } @else {
    <button type="button" class="btn btn-primary btn-sm edit" (click)="edit.emit()">Edit</button>
    <button type="button" class="btn btn-secondary btn-sm draft" (click)="draft.emit()">
      {{ draftLabel() }}
    </button>
    <button type="button" class="btn btn-danger btn-sm delete" (click)="startDelete()">
      Delete
    </button>
  }
</div>
