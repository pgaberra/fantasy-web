<div class="card-main">
  <span class="card-name">{{ projection().name }}</span>
  <span class="card-meta">
    @if (origin(); as from) {
      From {{ from.authorUsername }} ·
    } @else if (projection().kind === 'imported') {
      From a spreadsheet ·
    }
    Updated {{ projection().updatedAt | relativeTime }}
  </span>
</div>
<div class="card-actions">
  @if (confirmingDelete()) {
    <span class="confirm-text" tabindex="-1" #confirmPrompt>Delete “{{ projection().name }}”?</span>
    <button type="button" class="btn btn-danger btn-sm delete" (click)="confirmDelete()">
      Yes, delete
    </button>
    <button type="button" class="btn btn-secondary btn-sm cancel" (click)="cancelDelete()">
      Cancel
    </button>
  } @else {
    <button type="button" class="btn btn-primary btn-sm edit" (click)="edit.emit()">Edit</button>
    <button type="button" class="btn btn-secondary btn-sm draft" (click)="draft.emit()">
      Draft Mode
    </button>
    <button
      type="button"
      class="card-menu"
      [attr.aria-label]="'More actions for ' + projection().name"
      [appPopover]="cardMenu"
    >
      <app-icon name="more-vertical" />
    </button>
  }
</div>

<ng-template #cardMenu>
  <div class="card-menu-panel">
    @if (canShare()) {
      <button
        type="button"
        class="menu-item share"
        [disabled]="isPreparingShare()"
        (click)="share.emit()"
      >
        <app-icon name="share" />
        @if (isPreparingShare()) {
          <app-loading-indicator variant="inline" label="Opening" />
        } @else {
          Share
        }
      </button>
    }
    <button type="button" class="menu-item menu-item--danger delete" (click)="startDelete()">
      <app-icon name="trash" />
      Delete
    </button>
  </div>
</ng-template>
