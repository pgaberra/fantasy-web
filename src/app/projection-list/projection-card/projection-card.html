<div class="card-main">
  <span class="card-name">{{ projection().name }}</span>
  <span class="card-meta">
    @if (origin(); as from) {
      Following {{ from.authorUsername }} ·
    }
    Updated {{ projection().updatedAt | relativeTime }}
  </span>
</div>
<div class="card-actions">
  @if (confirmingDelete()) {
    <span class="confirm-text" tabindex="-1" #confirmPrompt>Delete “{{ projection().name }}”?</span>
    <button type="button" class="btn btn-danger btn-sm delete" (click)="confirmDelete()">
      Yes, delete
    </button>
    <button type="button" class="btn btn-secondary btn-sm cancel" (click)="cancelDelete()">
      Cancel
    </button>
  } @else {
    <button type="button" class="btn btn-primary btn-sm edit" (click)="edit.emit()">
      {{ openLabel() }}
    </button>
    <button type="button" class="btn btn-secondary btn-sm draft" (click)="draft.emit()">
      Draft Mode
    </button>
    <button
      type="button"
      class="card-menu"
      [attr.aria-label]="'More actions for ' + projection().name"
      [appPopover]="cardMenu"
    >
      <app-icon name="more-vertical" />
    </button>
  }
</div>

<ng-template #cardMenu>
  <div class="card-menu-panel">
    <!-- A menu item rather than a third button in the row: on a phone the row already carries
         two buttons and the menu, and a third would wrap under the name or squeeze the two that
         every projection has. -->
    @if (isFollow()) {
      <button type="button" class="menu-item copy" (click)="copyRequested.emit()">
        <app-icon name="copy" />
        Create a copy
      </button>
    }
    @if (canShare()) {
      <button
        type="button"
        class="menu-item share"
        [disabled]="isPreparingShare()"
        (click)="share.emit()"
      >
        <app-icon name="share" />
        @if (isPreparingShare()) {
          <app-loading-indicator variant="inline" label="Opening" />
        } @else {
          Share
        }
      </button>
    }
    <button type="button" class="menu-item menu-item--danger delete" (click)="startDelete()">
      <app-icon name="trash" />
      Delete
    </button>
  </div>
</ng-template>
