<div class="card-main">
  <span class="card-name">{{ projection().name }}</span>
  <span class="card-meta">{{ projection().season }}</span>
</div>
<div class="card-actions">
  <button type="button" class="edit" (click)="edit.emit()">Edit</button>
  <button type="button" class="delete" (click)="remove.emit()">Delete</button>
</div>
