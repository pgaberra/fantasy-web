<div class="summary">
  <div class="summary-header">
    <h2 class="summary-heading">Draft summary</h2>
    <button type="button" class="btn btn-secondary btn-sm" (click)="back.emit()">
      ← Edit draft
    </button>
  </div>

  <div class="summary-tabs" role="tablist" aria-label="Draft summary view">
    <button
      type="button"
      role="tab"
      class="summary-tab"
      [class.active]="activeTab() === 'projection'"
      [attr.aria-selected]="activeTab() === 'projection'"
      (click)="activeTab.set('projection')"
    >
      League projection
    </button>
    <button
      type="button"
      role="tab"
      class="summary-tab"
      [class.active]="activeTab() === 'results'"
      [attr.aria-selected]="activeTab() === 'results'"
      (click)="activeTab.set('results')"
    >
      Draft results
    </button>
  </div>

  @if (activeTab() === 'results') {
    <app-draft-results [rounds]="resultRounds()" [teams]="resultTeams()" />
  } @else {
    <p class="summary-sub">
      Every league team ranked by your projection. Sort any column — or switch to a per-position
      breakdown — to see who's strongest where.
    </p>
    <app-league-projection-table
      [data]="leagueProjection()"
      [scoringType]="scoringType()"
      [scoreHeading]="scoreHeading()"
    />
  }
</div>
