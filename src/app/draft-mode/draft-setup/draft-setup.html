<div class="draft-setup">
  <h2>Draft setup</h2>
  <p class="setup-hint">Set the league size and your draft position. You can change these later.</p>

  <app-league-sync
    class="setup-yahoo"
    [lastSync]="lastSync()"
    [lastEspnLeagueId]="lastEspnSync()?.leagueId ?? null"
    [lastEspnSyncedAt]="lastEspnSync()?.syncedAt ?? null"
    [lastEspnLeagueName]="lastEspnSync()?.leagueName ?? null"
    [openOnYahoo]="openOnYahoo()"
    (yahooSynced)="onYahooSynced($event)"
    (espnSynced)="onEspnSynced($event)"
  />

  @if (loadingTeams()) {
    <app-loading-indicator />
  } @else {
    <div class="setup-field">
      <span class="setup-label">Number of teams</span>
      <div class="stepper">
        <button
          type="button"
          class="stepper-btn"
          [disabled]="!canRemove()"
          (click)="removeTeam()"
          aria-label="Remove a team"
        >
          −
        </button>
        <span class="stepper-value">{{ numTeams() }}</span>
        <button
          type="button"
          class="stepper-btn"
          [disabled]="!canAdd()"
          (click)="addTeam()"
          aria-label="Add a team"
        >
          +
        </button>
      </div>
    </div>

    <div class="setup-field">
      <label class="setup-label" for="draft-position">Your draft position</label>
      <select id="draft-position" class="position-select" (change)="onPositionChange($event)">
        @for (position of positions(); track position) {
          <option [value]="position" [selected]="position === myPosition()">
            {{ position }}
          </option>
        }
      </select>
    </div>
  }

  <div class="setup-field">
    <span class="setup-label">Roster slots</span>
    <app-roster-slots-editor [(rosterSlots)]="editableRosterSlots" />
  </div>

  <div class="setup-actions">
    @if (canCancel()) {
      <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancel</button>
    }
    <button type="button" class="btn btn-primary" (click)="submit()">
      {{ canCancel() ? 'Save setup' : 'Start draft' }}
    </button>
  </div>
</div>
