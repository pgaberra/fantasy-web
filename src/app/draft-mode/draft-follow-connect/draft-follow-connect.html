<div class="modal-overlay" (click)="cancel()">
  <div class="modal" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <h2 class="modal-title">Add your ESPN cookies</h2>
    <p class="modal-text">{{ repair().reason }}</p>

    <label class="link-field">
      <span class="link-label">ESPN league ID</span>
      <input class="link-input" type="text" readonly [value]="repair().leagueId" />
    </label>
    <div class="link-cookies">
      <p class="link-hint">
        Your ESPN cookies let SlapStat read the draft and find your team in it, in a private or a
        public league.
      </p>
      <label class="link-field link-field--tight">
        <span class="link-label">espn_s2</span>
        <input
          class="link-input"
          type="password"
          autocomplete="off"
          aria-label="espn_s2 cookie"
          [value]="espnS2()"
          (input)="onEspnS2Input($event)"
        />
      </label>
      <label class="link-field link-field--tight">
        <span class="link-label">SWID</span>
        <input
          class="link-input"
          type="password"
          autocomplete="off"
          placeholder="{...}"
          aria-label="SWID cookie"
          [value]="swid()"
          (input)="onSwidInput($event)"
        />
      </label>
      <app-espn-cookie-help />
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      @if (settingsFailed()) {
        <button type="button" class="btn btn-primary" (click)="followAnyway()">
          Follow picks anyway
        </button>
      } @else {
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="!canSave() || checking()"
          (click)="save()"
        >
          @if (checking()) {
            <app-loading-indicator variant="inline" label="Checking the league" />
          } @else {
            Sync picks
          }
        </button>
      }
    </div>

    @if (error(); as message) {
      <p class="link-error" role="alert">
        <app-icon name="alert-triangle" [size]="14" />{{ message }}
      </p>
    }
  </div>
</div>
