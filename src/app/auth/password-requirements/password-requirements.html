<div class="password-policy">
  <p id="password-policy-heading" class="password-policy-heading">Password requirements:</p>
  <ul class="password-policy-list" aria-labelledby="password-policy-heading">
    @for (requirement of requirements(); track requirement.key) {
      <li class="password-policy-item" [class.met]="requirement.met">
        <span class="password-policy-icon" aria-hidden="true">{{
          requirement.met ? '✓' : '○'
        }}</span>
        <span>{{ requirement.label }}</span>
        <span class="sr-only">{{ requirement.met ? '(done)' : '(not yet)' }}</span>
      </li>
    }
  </ul>
  <p class="sr-only" role="status" aria-live="polite">
    {{ metCount() }} of {{ requirements().length }} requirements met
  </p>
</div>
