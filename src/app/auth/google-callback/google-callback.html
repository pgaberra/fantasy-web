<div class="auth-container">
  <div class="auth-card">
    @if (errorMessage()) {
      <h1 class="auth-title">Sign-in failed</h1>
      <p class="auth-subtitle">{{ errorMessage() }}</p>
      <a routerLink="/login" class="btn btn-primary btn-block btn-lg">Back to sign in</a>
    } @else {
      <h1 class="auth-title">Signing you in</h1>
      <p class="auth-subtitle">
        Finishing up with Google<span class="loading-dots" aria-hidden="true"></span>
      </p>
    }
  </div>
</div>
