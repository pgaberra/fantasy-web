@if (playersResource.isLoading()) {
  <app-loading-indicator />
} @else if (playersResource.error()) {
  <app-error-state
    title="Couldn't load the player data"
    message="Check your connection."
    (retry)="retryLoad()"
  />
} @else {
  <div class="demo-card">
    <app-offseason-data-notice />

    <!-- Bound exactly as the signed-in editor binds it, column controls included: the settings
         live in the table's own toolbar and header menus there, so a demo that kept the old
         settings panel above the table was showing a screen the product no longer has. -->
    <app-player-projections-table
      [(scoringType)]="scoringType"
      [(statWeights)]="statWeights"
      [players]="players()"
      [columnControls]="true"
      [(activeScoringColumns)]="activeScoringColumns"
      [(activeUtilityColumns)]="activeUtilityColumns"
      [(leagueSize)]="leagueSize"
      [(rosterSlots)]="rosterSlots"
      [(minGoalieGames)]="minGoalieGames"
      [(scaleSettings)]="scaleSettings"
      [(decimalSettings)]="decimalSettings"
      [(useDefaultDecimals)]="useDefaultDecimals"
      [showFullSeasonButton]="true"
      [maxVisiblePlayers]="visiblePlayers"
      (fullSeasonRequested)="openFullSeasonDialog()"
    >
      <button
        table-actions
        type="button"
        class="btn btn-primary btn-sm demo-save"
        (click)="saveProjection()"
      >
        Save projection
      </button>

      <!-- The editor's Import league button, in the same toolbar slot and with the same icon.
           Importing needs an account, so this one leads to the sign-up instead of the sync
           dialog, and the tooltip says so rather than the button opening onto a dead end.
           Secondary rather than the editor's primary, which is the treatment this slot already
           takes once a league is connected: on this page the primary is Save projection, and two
           filled buttons stacked in the same header read as two competing calls to action. -->
      @if (!syncDisabled) {
        <a
          table-toolbar-actions
          routerLink="/register"
          class="btn btn-secondary btn-sm demo-import"
          [appTooltip]="'Sign in to import your league settings from ' + syncablePlatforms"
        >
          <app-icon name="import" />
          Import league
        </a>
      }
    </app-player-projections-table>

    @if (showFullSeasonDialog()) {
      <app-full-season-dialog
        (confirm)="applyFullSeason($event)"
        (cancelled)="cancelFullSeason()"
      />
    }
  </div>
}
