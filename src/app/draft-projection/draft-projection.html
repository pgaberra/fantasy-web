@if (isLoading()) {
  <app-loading-indicator />
} @else {
  <div class="draft-projection">
    <div class="page-header">
      <a routerLink="/projections" class="back-link">← My projections</a>
      @if (isRenaming()) {
        <div class="rename-row">
          <input
            #renameInput
            class="rename-input"
            type="text"
            maxlength="100"
            [value]="renameValue()"
            [disabled]="renameSaving()"
            (input)="onRenameInput($event)"
            (keydown.enter)="saveRename()"
            (keydown.escape)="cancelRename()"
            aria-label="Projection name"
          />
          <button
            type="button"
            class="btn btn-primary btn-sm"
            [disabled]="renameSaving()"
            (click)="saveRename()"
          >
            Save
          </button>
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            [disabled]="renameSaving()"
            (click)="cancelRename()"
          >
            Cancel
          </button>
        </div>
        @if (renameError()) {
          <p class="rename-error">{{ renameError() }}</p>
        }
      } @else {
        <div class="page-header-row">
          <h1 class="projection-title">
            <button
              type="button"
              class="rename-trigger"
              title="Rename projection"
              aria-label="Rename projection"
              (click)="startRename()"
            >
              {{ projectionName() }}
              <span class="rename-icon" aria-hidden="true">✎</span>
            </button>
          </h1>
          <div class="page-header-actions">
            <button type="button" class="btn btn-secondary" (click)="showShareDialog.set(true)">
              Share
            </button>
            <a
              [routerLink]="['/projections', projectionId(), 'draft']"
              class="btn btn-primary draft-mode-link"
            >
              {{ draftLinkLabel() }}
            </a>
          </div>
        </div>
      }
    </div>

    <app-offseason-data-notice />

    <app-projection-settings-section
      [(scoringType)]="scoringType"
      [(activeScoringColumns)]="activeScoringColumns"
      [(activeUtilityColumns)]="activeUtilityColumns"
      [(scaleSettings)]="scaleSettings"
      [(useDefaultDecimals)]="useDefaultDecimals"
      [(leagueSize)]="leagueSize"
      [(rosterSlots)]="rosterSlots"
      [(minGoalieGames)]="minGoalieGames"
    >
      <app-league-sync
        [lastSync]="yahooSync()"
        (yahooSynced)="applyYahooSettings($event)"
        (espnSynced)="applyEspnSettings($event)"
      />
    </app-projection-settings-section>

    <div class="projections-tables">
      <app-player-projections-table
        [scoringType]="scoringType()"
        [saveStatus]="saveStatus()"
        [(statWeights)]="statWeights"
        [players]="players()"
        [initialProjections]="loadedProjections()"
        [activeColumns]="activeColumns()"
        [leagueSize]="leagueSize()"
        [rosterSlots]="rosterSlots()"
        [minGoalieGames]="minGoalieGames()"
        [scaleSettings]="scaleSettings()"
        [(decimalSettings)]="decimalSettings"
        [useDefaultDecimals]="useDefaultDecimals()"
        [showFullSeasonButton]="true"
        (fullSeasonRequested)="openFullSeasonDialog()"
      />
    </div>

    @if (diverged() && yahooSync(); as sync) {
      <app-sync-warning-dialog
        [leagueName]="sync.leagueName"
        [reSyncing]="reSyncing()"
        [error]="reSyncError()"
        (reSync)="reSync()"
        (confirm)="confirmUnsync()"
      />
    }

    @if (showFullSeasonDialog()) {
      <app-full-season-dialog
        (confirm)="applyFullSeason($event)"
        (cancelled)="cancelFullSeason()"
      />
    }

    @if (showShareDialog() && projectionId()) {
      <app-share-dialog
        [projectionId]="projectionId()!"
        [players]="sharedPlayers()"
        (closed)="showShareDialog.set(false)"
      />
    }
  </div>
}
