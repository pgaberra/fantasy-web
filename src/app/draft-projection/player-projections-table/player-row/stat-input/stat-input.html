@if (isStatApplicable()) {
  <input
    [type]="isToi() ? 'text' : 'number'"
    class="stat-input"
    [value]="formattedValue()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    [attr.min]="!isToi() && !isPlusMinus() ? 0 : null"
  />
} @else {
  <span class="stat-placeholder">-</span>
}
