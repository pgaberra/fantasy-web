@if (isStatApplicable()) {
  @if (readonly()) {
    <span class="stat-readonly">{{ isToi() ? formattedToi() : formattedValue() }}</span>
  } @else if (isToi()) {
    <app-toi-input
      [toiInSeconds]="value()"
      [warning]="warning()"
      (toiInput)="onInput($event)"
      (toiKeydown)="onKeydown($event)"
    />
  } @else {
    <!-- The value is written by the component, not bound here: a field being typed in keeps its
         own text, so the padding can't fight the caret.

         A text field, not a number field: the browser writes a number field in the machine's
         locale, so a cell set to one decimal read `36,5` on a Swedish computer. The table clamps
         and rounds what is typed anyway, so what the field gives up is only its arrow keys. -->
    <input
      #statField
      type="text"
      inputmode="decimal"
      class="stat-input"
      [class.has-warning]="!!warning()"
      [appTooltip]="warning()"
      (input)="onInput($event)"
      (keydown)="onStatKeydown($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
  }
} @else {
  <span class="stat-placeholder">-</span>
}
