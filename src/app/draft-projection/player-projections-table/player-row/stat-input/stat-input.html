@if (isStatApplicable()) {
  @if (isToi()) {
    <app-toi-input
      [toiInSeconds]="value()"
      [warning]="warning()"
      (toiInput)="onInput($event)"
      (toiKeydown)="onKeydown($event)"
    />
  } @else {
    <input
      type="number"
      class="stat-input"
      [class.has-warning]="!!warning()"
      [attr.title]="warning()"
      [value]="formattedValue()"
      (input)="onInput($event)"
      [attr.min]="canStatBeNegative() ? null : 0"
      [attr.max]="isPercentage() ? 100 : null"
    />
  }
} @else {
  <span class="stat-placeholder">-</span>
}
