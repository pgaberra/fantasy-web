<p class="menu-title">League setup</p>

@if (syncedLeagueName(); as leagueName) {
  <div class="sync-provenance">
    <span class="sync-dot" aria-hidden="true"></span>
    <span class="sync-league">Imported from {{ leagueName }}</span>
  </div>
  <button type="button" class="menu-item" (click)="manageSync.emit()">
    <svg
      viewBox="0 0 24 24"
      width="15"
      height="15"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-7.5-4M3 12a9 9 0 0 1 9-9 9 9 0 0 1 7.5 4" />
      <path d="M21 3v5h-5M3 21v-5h5" />
    </svg>
    Re-sync or change league
  </button>
  <div class="menu-separator"></div>
}

@if (scoringType() === 'category') {
  <div class="menu-field">
    <label for="league-size-input">League size</label>
    <span class="field-with-unit">
      <input
        id="league-size-input"
        type="number"
        min="2"
        max="30"
        [value]="leagueSize()"
        (input)="onLeagueSizeInput($event)"
      />
      <span class="field-unit">teams</span>
    </span>
  </div>

  <div class="menu-field">
    <span class="field-label">
      <label for="min-goalie-games-input">Minimum goalie games</label>
      <app-help-tip
        label="What the goalie minimum does"
        text="Goalies projected below this minimum are ranked last."
      />
    </span>
    <input
      id="min-goalie-games-input"
      type="number"
      min="0"
      [max]="FULL_SEASON_GAMES"
      [value]="minGoalieGames()"
      (input)="onMinGoalieGamesInput($event)"
    />
  </div>

  <div class="menu-separator"></div>
  <p class="menu-title">Roster slots</p>
  <app-roster-slots-editor [(rosterSlots)]="rosterSlots" />
  <p class="menu-note">League size and roster slots affect player values in your rankings.</p>
}
