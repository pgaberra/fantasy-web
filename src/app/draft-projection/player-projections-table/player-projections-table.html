<section class="table-section">
  <h2>Player Projections</h2>
  <div class="table-wrapper">
    <table>
      <thead
        app-projections-table-header
        [activeColumns]="activeColumns()"
        [scoringType]="scoringType()"
        [(statWeights)]="statWeights"
        [useDefaultDecimals]="useDefaultDecimals()"
        [(decimalSettings)]="decimalSettings"
      ></thead>
      <tbody>
        @for (projection of sortedPlayerProjectionsExcludingCurrentPlayerEdit(); track projection.playerId) {
          <tr
            app-projection-player-row
            [rank]="realTimeRanks().get(projection.playerId)!"
            [projection]="projection"
            [player]="getPlayer(projection.playerId)"
            [activeColumns]="activeColumns()"
            [scoringType]="scoringType()"
            [decimalSettings]="decimalSettings()"
            [isEditing]="editingPlayerId() === projection.playerId"
            (focusin)="onRowFocusIn(projection.playerId)"
            (focusout)="onRowFocusOut($event)"
            (statInput)="onStatInput($event.playerId, $event.key, $event.event)"
            (toiKeydown)="onToiKeydown($event.playerId, $event.event)"
          ></tr>
        }
      </tbody>
    </table>
  </div>
</section>
