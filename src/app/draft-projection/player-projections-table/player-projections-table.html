<section class="table-section">
  <div class="table-header">
    <h2>Player Projections</h2>
    <div class="table-controls">
      <div class="search-control">
        <label for="player-search">Search</label>
        <input
          id="player-search"
          type="search"
          placeholder="Search player…"
          [value]="searchTerm()"
          (input)="onSearchInput($event)"
        />
      </div>
      <app-position-filter [(value)]="positionFilter" />
      @if (availableTeams().length) {
        <app-team-filter [teams]="availableTeams()" [(value)]="teamFilter" />
      }
    </div>
  </div>
  <div class="table-wrapper">
    <table>
      <thead
        app-projections-table-header
        [activeColumns]="filteredActiveColumns()"
        [scoringType]="scoringType()"
        [(statWeights)]="statWeights"
        [useDefaultDecimals]="useDefaultDecimals()"
        [(decimalSettings)]="decimalSettings"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sort)="onSort($event)"
      ></thead>
      <tbody>
        @for (projection of visibleProjections(); track projection.playerId) {
          <tr
            app-player-row
            [positionRank]="positionRanks().get(projection.playerId)!"
            [totalRank]="
              positionFilter() !== 'ALL' ? (realTimeRanks().get(projection.playerId) ?? null) : null
            "
            [projection]="projection"
            [playerScore]="playerScores().get(projection.playerId)!"
            [player]="getPlayer(projection.playerId)"
            [activeColumns]="filteredActiveColumns()"
            [scoringType]="scoringType()"
            [decimalSettings]="decimalSettings()"
            [isEditing]="editingPlayerId() === projection.playerId"
            (focusin)="onRowFocusIn(projection.playerId)"
            (focusout)="onRowFocusOut($event)"
            (statInput)="onStatInput($event.playerId, $event.key, $event.event)"
            (toiKeydown)="onToiKeydown($event.playerId, $event.event)"
          ></tr>
        }
      </tbody>
    </table>
  </div>
  @if (matchingCount() === 0) {
    <p class="table-empty">No players match your search.</p>
  } @else {
    <div class="table-footer">
      <span class="result-count"
        >Showing {{ visibleProjections().length }} of {{ matchingCount() }}</span
      >
      @if (hasMore()) {
        <button type="button" class="show-more-button" (click)="showMore()">Show more</button>
      }
    </div>
  }
</section>
