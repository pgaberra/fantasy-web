<section class="settings-section">
  <h2>Scoring Stats</h2>
  <p class="hint">Select the stats used in your league:</p>
  <app-stat-group
    title="Skater Stats"
    [activeStats]="activeSkaterStats()"
    [availableStats]="availableSkaterStats()"
    (statRemoved)="toggle($event)"
    (statAdded)="toggle($event)"
  />
  <app-stat-group
    title="Goalie Stats"
    [activeStats]="activeGoalieStats()"
    [availableStats]="availableGoalieStats()"
    (statRemoved)="toggle($event)"
    (statAdded)="toggle($event)"
  />
</section>
