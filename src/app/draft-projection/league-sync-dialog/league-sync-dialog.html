<div class="dialog-backdrop" (click)="closed.emit()">
  <div
    class="dialog-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="league-sync-title"
    (click)="$event.stopPropagation()"
  >
    <div class="dialog-header">
      <h2 id="league-sync-title" class="dialog-title">Import league settings</h2>
      <button type="button" class="dialog-close" aria-label="Close" (click)="closed.emit()">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <p class="dialog-body">
      We read the scoring type, active stats and roster slots from your league and apply them to
      this projection, replacing what's set here now.
    </p>

    <ng-content />

    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary btn-sm" (click)="closed.emit()">Done</button>
    </div>
  </div>
</div>
