@if (anyAvailable) {
  <p class="league-sync-hint">{{ hint }}</p>
  <app-platform-tabs
    label="Fantasy platform to import from"
    [platforms]="platforms"
    [selected]="provider()"
    (selectedChange)="choose($event)"
  />
  @if (pendingSwitch(); as ask) {
    <app-platform-switch-dialog
      [linkedPlatform]="ask.linkedPlatform"
      [leagueName]="ask.leagueName"
      [targetPlatform]="ask.targetPlatform"
      (confirm)="switchAndDisconnect(ask.target)"
      (cancelled)="pendingTarget.set(null)"
    />
  }
  <!-- The league's own tab is not on offer (Yahoo between seasons), so no panel names the link. -->
  @if (linkedOffTab(); as leagueName) {
    <div class="league-sync-linked">
      <span class="sync-dot" aria-hidden="true"></span>
      <span class="league-sync-linked-text"
        >Synced with <strong>{{ leagueName }}</strong></span
      >
      <button type="button" class="btn btn-secondary btn-sm" (click)="disconnected.emit('button')">
        Disconnect
      </button>
    </div>
  }
  @switch (provider()) {
    @case ('yahoo') {
      <app-yahoo-league-sync
        [lastSync]="lastSync()"
        [disconnectable]="linkedPlatform() === 'yahoo'"
        (synced)="yahooSynced.emit($event)"
        (disconnected)="disconnected.emit('button')"
      />
    }
    @case ('espn') {
      <app-espn-league-sync
        [lastLeagueId]="lastEspnLeagueId()"
        [lastSyncedAt]="lastEspnSyncedAt()"
        [lastLeagueName]="lastEspnLeagueName()"
        [disconnectable]="linkedPlatform() === 'espn'"
        (synced)="espnSynced.emit($event)"
        (disconnected)="disconnected.emit('button')"
      />
    }
  }
} @else if (linkedLeagueName(); as leagueName) {
  <!-- No platform can be synced (Yahoo between seasons, ESPN off), yet a league imported while
       one could still owns the settings, and disconnecting is how they come back. -->
  <div class="league-sync-linked">
    <span class="sync-dot" aria-hidden="true"></span>
    <span class="league-sync-linked-text"
      >Synced with <strong>{{ leagueName }}</strong></span
    >
    <button type="button" class="btn btn-secondary btn-sm" (click)="disconnected.emit('button')">
      Disconnect
    </button>
  </div>
}
