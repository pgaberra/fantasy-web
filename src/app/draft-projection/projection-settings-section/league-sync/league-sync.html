@if (espnEnabled) {
  <div class="league-sync-header">
    <span class="league-sync-title">Import league settings</span>
    <span class="league-sync-optional">optional</span>
  </div>
  <p class="league-sync-hint">
    On Yahoo or ESPN? Choose your platform to auto-fill scoring and roster settings from your
    league.
  </p>
  <div class="provider-picker" role="tablist" aria-label="Fantasy platform to import from">
    <button
      type="button"
      role="tab"
      class="provider-tab"
      [class.provider-tab--active]="provider() === 'yahoo'"
      [attr.aria-selected]="provider() === 'yahoo'"
      (click)="provider.set('yahoo')"
    >
      Yahoo
    </button>
    <button
      type="button"
      role="tab"
      class="provider-tab"
      [class.provider-tab--active]="provider() === 'espn'"
      [attr.aria-selected]="provider() === 'espn'"
      (click)="provider.set('espn')"
    >
      ESPN
    </button>
  </div>
  @switch (provider()) {
    @case ('yahoo') {
      <app-yahoo-league-sync [lastSync]="lastSync()" (synced)="yahooSynced.emit($event)" />
    }
    @case ('espn') {
      <app-espn-league-sync (synced)="espnSynced.emit($event)" />
    }
  }
} @else {
  <app-yahoo-league-sync [lastSync]="lastSync()" (synced)="yahooSynced.emit($event)" />
}
