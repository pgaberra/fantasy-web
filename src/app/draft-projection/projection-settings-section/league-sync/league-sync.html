@if (anyAvailable) {
  <p class="league-sync-hint">{{ hint }}</p>
  <app-platform-tabs
    label="Fantasy platform to import from"
    [platforms]="platforms"
    [(selected)]="provider"
  />
  @switch (provider()) {
    @case ('yahoo') {
      <app-yahoo-league-sync [lastSync]="lastSync()" (synced)="yahooSynced.emit($event)" />
    }
    @case ('espn') {
      <app-espn-league-sync
        [lastLeagueId]="lastEspnLeagueId()"
        [lastSyncedAt]="lastEspnSyncedAt()"
        [lastLeagueName]="lastEspnLeagueName()"
        (synced)="espnSynced.emit($event)"
      />
    }
  }
}
