@if (anyAvailable) {
  <p class="league-sync-hint">{{ hint }}</p>
  <app-platform-tabs
    label="Fantasy platform to import from"
    [platforms]="platforms"
    [selected]="provider()"
    (selectedChange)="choose($event)"
  />
  @if (pendingSwitch(); as ask) {
    <app-platform-switch-dialog
      [linkedPlatform]="ask.linkedPlatform"
      [leagueName]="ask.leagueName"
      [targetPlatform]="ask.targetPlatform"
      (confirm)="switchAndDisconnect(ask.target)"
      (cancelled)="pendingTarget.set(null)"
    />
  }
  @switch (provider()) {
    @case ('yahoo') {
      <app-yahoo-league-sync [lastSync]="lastSync()" (synced)="yahooSynced.emit($event)" />
    }
    @case ('espn') {
      <app-espn-league-sync
        [lastLeagueId]="lastEspnLeagueId()"
        [lastSyncedAt]="lastEspnSyncedAt()"
        [lastLeagueName]="lastEspnLeagueName()"
        (synced)="espnSynced.emit($event)"
      />
    }
  }
}

<!-- Outside the platforms' own block: a league imported while its platform's sync was on still owns
     the settings once it is off (Yahoo between seasons), and disconnecting is how they come back. -->
@if (linkedLeagueName(); as leagueName) {
  <div class="league-link">
    <p class="league-link-note">
      <app-icon name="lock" [size]="14" />
      <span>The scoring and league settings are locked to {{ leagueName }} while synced.</span>
    </p>
    <button type="button" class="btn btn-secondary btn-sm" (click)="disconnected.emit('button')">
      Disconnect league
    </button>
  </div>
}
