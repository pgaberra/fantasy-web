<section class="settings-section">
  <h2>Projection Settings</h2>
  <p class="hint">Configure additional options for your player projections:</p>
  <div class="projection-settings-list">
    <app-setting-row
      name="Show decimals row"
      desc="Display a row in the projections table to configure decimal places per stat."
    >
      <app-toggle-switch [on]="showDecimalRow()" (toggled)="toggleShowDecimalRow()" />
    </app-setting-row>
    @for (key of UTILITY_STAT_KEYS; track key) {
      <app-setting-row [name]="key | utilityStatLabel" [desc]="key | statDesc">
        <app-toggle-switch [on]="activeUtilityColumns().has(key)" (toggled)="toggleActiveUtilityColumn(key)" />
      </app-setting-row>
      @if (activeUtilityColumns().has(key)) {
        <app-setting-row
          class="setting-row--sub"
          [name]="'Scale scoring on ' + (key | utilityStatLabel) + ' change'"
          [desc]="'Automatically scale all scoring stats proportionally when ' + (key | utilityStatLabel) + ' is updated.'"
        >
          <app-toggle-switch [on]="isScaleActive(key)" (toggled)="toggleScale(key)" />
        </app-setting-row>
        @if (isScaleActive(key)) {
          <app-setting-row
            class="setting-row--sub setting-row--advanced"
            name="Customize scaled stats"
            desc="Choose which scoring stats are affected by scaling."
          >
            <button class="advanced-toggle-btn" (click)="toggleAdvanced(key)">
              {{ isAdvancedVisible(key) ? 'Hide' : 'Show' }}
            </button>
          </app-setting-row>
          @if (isAdvancedVisible(key)) {
            @for (statKey of activeScoringColumns(); track statKey) {
              <app-setting-row class="setting-row--sub setting-row--stat" [name]="statKey | statLabel">
                <app-toggle-switch [on]="isScaleStatActive(statKey, key)" (toggled)="toggleScaleStat(statKey, key)" />
              </app-setting-row>
            }
          }
        }
      }
    }
  </div>
</section>
