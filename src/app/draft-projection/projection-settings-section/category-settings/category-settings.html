<app-setting-row name="League Size">
  <span class="league-size-field">
    <input
      type="number"
      class="league-size-input"
      min="2"
      max="30"
      [value]="leagueSize()"
      (input)="onLeagueSizeInput($event)"
    />
    <span class="league-size-unit">teams</span>
  </span>
</app-setting-row>
<app-roster-slots-editor [(rosterSlots)]="rosterSlots" />
<p class="category-settings-hint">
  We use League Size and Roster Slots to optimize the rankings for your league.
</p>
