<section class="projection-manager">
  <h2>My projections</h2>

  <div class="pm-controls">
    <div class="pm-group">
      <label for="saved-projection">Load saved</label>
      <select id="saved-projection" [disabled]="isBusy()" (change)="onLoad($event)">
        <option value="">Choose a projection…</option>
        @for (projection of savedProjections(); track projection.id) {
          <option [value]="projection.id">{{ projection.name }} ({{ projection.season }})</option>
        }
      </select>
    </div>

    @if (loadedName()) {
      <div class="pm-group pm-current">
        <span class="pm-loaded">Editing “{{ loadedName() }}”</span>
        <button type="button" [disabled]="isBusy()" (click)="save.emit()">Save</button>
        <button
          type="button"
          class="pm-delete"
          [disabled]="isBusy()"
          (click)="deleteCurrent.emit()"
        >
          Delete
        </button>
      </div>
    }

    <div class="pm-group">
      <label for="new-projection-name">Save as new</label>
      <input
        id="new-projection-name"
        type="text"
        maxlength="100"
        [value]="newName()"
        [disabled]="isBusy()"
        placeholder="Projection name"
        (input)="onNameInput($event)"
      />
      <button type="button" [disabled]="isBusy() || !newName().trim()" (click)="onSaveAs()">
        Save
      </button>
    </div>
  </div>
</section>
