<div class="dialog-backdrop">
  <div
    class="dialog-card"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="sync-warning-title"
    aria-describedby="sync-warning-body"
    (keydown.escape)="$event.stopPropagation(); cancelled.emit()"
  >
    <div class="dialog-header">
      <h2 id="sync-warning-title" class="dialog-title">No longer in sync</h2>
      <!-- Not a plain dismissal: the cross leaves the change unmade and keeps the league. -->
      <button
        type="button"
        class="dialog-close"
        [attr.aria-label]="cancelLabel()"
        [appTooltip]="cancelLabel()"
        (click)="cancelled.emit()"
      >
        <app-icon name="close" [size]="20" />
      </button>
    </div>
    <p id="sync-warning-body" class="dialog-body">
      Changing {{ change() }} will disconnect this {{ subject() }} from
      <strong>{{ leagueName() }}</strong
      >.
    </p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary btn-sm" (click)="cancelled.emit()">
        Cancel
      </button>
      <button type="button" class="btn btn-primary btn-sm" (click)="confirm.emit()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
