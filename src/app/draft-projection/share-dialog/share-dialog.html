<div class="dialog-backdrop">
  <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="share-title">
    <div class="dialog-header">
      <h2 id="share-title" class="dialog-title">Share this projection</h2>
      <button type="button" class="dialog-close" aria-label="Close" (click)="closed.emit()">
        &times;
      </button>
    </div>

    @if (isLoading()) {
      <p class="dialog-body">Checking…</p>
    } @else if (share(); as activeShare) {
      <div class="link-row">
        <input
          class="link-input"
          type="text"
          readonly
          [value]="activeShare.shareUrl"
          aria-label="Share link"
        />
        <button type="button" class="btn btn-primary btn-sm" (click)="copyLink()">
          {{ copied() ? 'Copied!' : 'Copy' }}
        </button>
      </div>
    } @else {
      @if (needsUsername()) {
        <p class="dialog-body">Pick a username to share a projection.</p>

        <label class="username-label" for="share-username">Pick a username</label>
        <input
          id="share-username"
          class="username-input"
          type="text"
          autocomplete="username"
          [attr.maxlength]="usernameMaxLength"
          placeholder="e.g. beerleaguehero"
          [value]="usernameInput()"
          (input)="onUsernameInput($event)"
        />
      } @else {
        <p class="username-hint">
          Credited to <strong>{{ username() }}</strong
          >. Change it on your profile.
        </p>
      }

      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary btn-sm" (click)="closed.emit()">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-primary btn-sm"
          [disabled]="isSaving() || !canPublish()"
          (click)="publish()"
        >
          {{ isSaving() ? 'Sharing…' : 'Create link' }}
        </button>
      </div>
    }

    @if (errorMessage()) {
      <p class="share-error">{{ errorMessage() }}</p>
    }
  </div>
</div>
