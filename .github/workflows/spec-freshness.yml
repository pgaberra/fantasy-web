# The PR check only fails a branch that itself put the pinned spec out of step; a producer
# merge staling it is reported there as a warning, because it is not the PR author's doing and
# blocking every open PR on it cost more than it caught. That leaves nobody owning the news
# that the pin has gone stale, which is this workflow's job.
#
# It is a checkout and one API call per spec, a few seconds a run.
name: Spec freshness

on:
  schedule:
    # Weekday mornings, Stockholm time. Nothing here is urgent enough to want a weekend alarm.
    - cron: '15 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-specs:
    name: Pinned specs still match their producers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No BASE_SHA: there is no branch to blame here, so any drift at all is the finding.
      - name: Verify pinned BFF spec is in sync
        env:
          PRODUCER_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/check-pinned-spec.sh \
            pgaberra/fantasy-bff specs/bff-openapi.yaml specs/bff-openapi.yaml \
            'npm run generate:api'
