name: PR Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify pinned BFF spec is in sync
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SPEC_READ_TOKEN is not set. Add a fine-grained PAT with read access to fantasy-bff contents as a repo secret."
            exit 1
          fi
          if ! gh api repos/pgaberra/fantasy-bff/contents/specs/bff-openapi.yaml \
                -H "Accept: application/vnd.github.raw" > /tmp/bff-openapi.yaml 2> /tmp/gh-err.txt; then
            echo "::error::Could not fetch the BFF spec — SPEC_READ_TOKEN is likely invalid or expired. Rotate it and update the repo secret. (This is an auth failure, not a spec mismatch.)"
            cat /tmp/gh-err.txt
            exit 1
          fi
          if ! diff -u specs/bff-openapi.yaml /tmp/bff-openapi.yaml; then
            echo "::error::Pinned BFF spec is stale. Copy fantasy-bff/specs/bff-openapi.yaml into specs/bff-openapi.yaml and run npm run generate:api."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API client
        run: npm run generate:api

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Publish coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        with:
          json-summary-path: coverage/fantasy-web/coverage-summary.json
          json-final-path: coverage/fantasy-web/coverage-final.json

      - name: Build
        run: npm run build
