name: PR Checks

on:
  # Not on push to master: a squash-merge lands byte-identical code to what the PR's own
  # pull_request run just tested, so a second full build+test here was pure duplication —
  # the single biggest line item in the account's Actions minutes. The trade-off: without
  # GitHub Pro we can't require this check before merge, so this was also the only net that
  # caught two PRs merging close together where the second wasn't rebased on the first.
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Passing BASE_SHA is what makes this only blame the branch: a producer merge staled the
      # copy in every open PR at once, and failing all of them blocked work that had nothing to
      # do with the spec. The script carries the whole argument.
      - name: Verify pinned BFF spec is in sync
        if: github.actor != 'dependabot[bot]'
        env:
          PRODUCER_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash .github/scripts/check-pinned-spec.sh \
            pgaberra/fantasy-bff specs/bff-openapi.yaml specs/bff-openapi.yaml \
            'npm run generate:api'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API client
        run: npm run generate:api

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Publish coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        with:
          json-summary-path: coverage/fantasy-web/coverage-summary.json
          json-final-path: coverage/fantasy-web/coverage-final.json

      - name: Build
        run: npm run build
