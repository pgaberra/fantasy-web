name: PR Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify pinned BFF spec is in sync
        env:
          GH_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
        run: |
          gh api repos/pgaberra/fantasy-bff/contents/specs/bff-openapi.yaml \
            -H "Accept: application/vnd.github.raw" > /tmp/bff-openapi.yaml
          if ! diff -u specs/bff-openapi.yaml /tmp/bff-openapi.yaml; then
            echo "::error::Pinned BFF spec is stale. Copy fantasy-bff/specs/bff-openapi.yaml into specs/bff-openapi.yaml and run npm run generate:api."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API client
        run: npm run generate:api

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Publish coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          json-summary-path: coverage/fantasy-web/coverage-summary.json
          json-final-path: coverage/fantasy-web/coverage-final.json

      - name: Build
        run: npm run build
