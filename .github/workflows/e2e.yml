name: E2E (staging)

on:
  workflow_dispatch:
  # Used to run on every push to master too — "the code that just became staging is the code
  # nobody has run end to end yet" — but each of those runs installs Node, installs a Chromium,
  # and waits out staging's redeploy before it even starts testing, and merges land several times
  # a day. Traded for the daily run catching a break within 24h instead of immediately: dispatch
  # this manually right after a merge you want checked sooner.
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC

permissions:
  contents: read
  issues: write

# Every run tests the same deployed staging, so two of them racing tells us nothing twice — e.g.
# a manual dispatch fired while the daily schedule is already running. Each run costs minutes and
# leaves a registered account behind, so the newest run wins and the rest are cancelled. A
# cancelled run is neither success nor failure, so it neither raises nor stands down the alarm.
concurrency:
  group: e2e-staging
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_BASE_URL: https://staging.slapstat.com
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run e2e

      # Only "Run E2E tests" is allowed to decide whether this job is red. Every step below it
      # reports on the result rather than producing it, so a GitHub-side failure in one of them —
      # a full artifact quota, a rate-limited API call — must not masquerade as a broken staging.
      # That exact confusion cost us a day: the storage quota reddened six green runs and the
      # alarm below dutifully fired on every one of them.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      # Closing it is what keeps the alarm working. While an issue is open every later failure is
      # only a comment on it, and a comment on a resolved issue is exactly the kind of signal
      # nobody receives — which is the failure this whole mechanism exists to avoid. Leaving that
      # to someone remembering would put us back where we started.
      - name: Stand down the alarm
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label e2e-red --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again — [run]($RUN_URL). Closing so the next failure opens a fresh issue instead of commenting on a resolved one."
          fi

      # A red cross in the Actions tab is not a signal — it went unread for five days while this
      # suite reproduced a data-loss bug nightly. An issue is something that sits in the way.
      # One issue per outage, not one per run: a failure while an issue is already open just
      # adds a comment.
      - name: Raise the alarm
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create e2e-red --color B60205 \
            --description "The E2E suite against staging is failing" 2>/dev/null || true
          open=$(gh issue list --label e2e-red --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still failing — [run]($RUN_URL), triggered by \`${{ github.event_name }}\`."
            exit 0
          fi
          {
            echo "The E2E suite failed against deployed staging."
            echo
            echo "- Run: $RUN_URL"
            echo "- Triggered by: \`${{ github.event_name }}\`"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "The Playwright report is attached to the run as an artifact, with a screenshot per failure."
            echo
            echo "Close this issue once the suite is green again; the next failure opens a fresh one."
            echo "While it stays open, further failures are added here as comments instead."
          } > e2e-failure.md
          gh issue create --title "E2E against staging is failing" --label e2e-red --body-file e2e-failure.md
