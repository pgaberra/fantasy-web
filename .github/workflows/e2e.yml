name: E2E (staging)

on:
  workflow_dispatch:
  # Used to run on every push to master too — "the code that just became staging is the code
  # nobody has run end to end yet" — but a run started by a merge has to wait out staging's
  # redeploy before it tests anything that merge changed, and merges land several times a day.
  # Every run registers throwaway accounts on staging, and a merge landing while a run waits
  # cancels it (see concurrency below), so a busy day leaves accounts behind and few results.
  # Traded for the daily run catching a break within 24h instead of immediately: dispatch this
  # manually once staging has redeployed a merge you want checked sooner.
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC

permissions:
  contents: read
  issues: write

# Every run tests the same deployed staging, so two of them racing tells us nothing twice — e.g.
# a manual dispatch fired while the daily schedule is already running. Each run also registers
# throwaway accounts on staging that stay there, so the newest run wins and the rest are
# cancelled. A cancelled run is neither success nor failure, so it neither raises nor stands down
# the alarm.
concurrency:
  group: e2e-staging
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Staging is locked to the owner's IP by default, and a GitHub runner has a different IP on
      # every run. The restricted staging-access key lets this runner in, and only this runner:
      # the server takes the IP from the SSH connection itself, and the rule expires on its own
      # after 90 minutes should the revoke below never run (staging_access_forced.sh in the
      # monorepo root). Failing here fails the job, which is right: nothing was tested.
      - name: Let this runner through the staging firewall
        env:
          ACCESS_KEY: ${{ secrets.STAGING_ACCESS_SSH_KEY }}
        run: |
          if [ -z "$ACCESS_KEY" ]; then
            echo "::error::Secret STAGING_ACCESS_SSH_KEY is not set — see staging-access-setup.md."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ACCESS_KEY" > ~/.ssh/id_staging_access
          chmod 600 ~/.ssh/id_staging_access
          printf '%s\n' '62.238.17.178 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH9wW3pT4VmX2Y3ny5//zQUa/JFR/6l8b7WGQ70Jhsqh' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_staging_access -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            root@62.238.17.178 allow

      - name: Run E2E tests
        env:
          E2E_BASE_URL: https://staging.slapstat.com
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run e2e

      # Also on failure and cancellation, so the runner is not left allowed until its rule expires.
      - name: Close the staging firewall behind this runner
        if: always()
        continue-on-error: true
        run: |
          [ -f ~/.ssh/id_staging_access ] || exit 0
          ssh -i ~/.ssh/id_staging_access -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            root@62.238.17.178 revoke

      # Only "Run E2E tests" is allowed to decide whether this job is red. Every step below it
      # reports on the result rather than producing it, so a GitHub-side failure in one of them —
      # a full artifact quota, a rate-limited API call — must not masquerade as a broken staging.
      # That exact confusion cost us a day: the storage quota reddened six green runs and the
      # alarm below dutifully fired on every one of them.
      #
      # Screenshots only, never the HTML report or a trace (see playwright.config.ts): the repo is
      # public, anyone signed in to GitHub can download this artifact, and both of those carry the
      # staging account's password as typed. GitHub's `***` masking covers the log, not artifacts.
      - name: Upload failure screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-screenshots
          path: test-results/**/*.png
          retention-days: 3

      # Closing it is what keeps the alarm working. While an issue is open every later failure is
      # only a comment on it, and a comment on a resolved issue is exactly the kind of signal
      # nobody receives — which is the failure this whole mechanism exists to avoid. Leaving that
      # to someone remembering would put us back where we started.
      #
      # Only a green run of master's specs stands it down. A run dispatched on a branch tests that
      # branch's specs, and going green there says nothing about the suite master runs every
      # morning: a branch run closed #714 before its fix had merged.
      - name: Stand down the alarm
        if: success() && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label e2e-red --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again — [run]($RUN_URL). Closing so the next failure opens a fresh issue instead of commenting on a resolved one."
          fi

      # A red cross in the Actions tab is not a signal — it went unread for five days while this
      # suite reproduced a data-loss bug nightly. An issue is something that sits in the way.
      # One issue per outage, not one per run: a failure while an issue is already open just
      # adds a comment.
      #
      # Master only, like the stand-down above: the issue says staging's suite is failing, and a
      # branch run is testing that branch's specs. Its red cross is for whoever dispatched it.
      - name: Raise the alarm
        if: failure() && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create e2e-red --color B60205 \
            --description "The E2E suite against staging is failing" 2>/dev/null || true
          open=$(gh issue list --label e2e-red --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still failing — [run]($RUN_URL), triggered by \`${{ github.event_name }}\`."
            exit 0
          fi
          {
            echo "The E2E suite failed against deployed staging."
            echo
            echo "- Run: $RUN_URL"
            echo "- Triggered by: \`${{ github.event_name }}\`"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "A screenshot of each failure is attached to the run as an artifact. For the full report or a trace, run \`npm run e2e\` locally."
            echo
            echo "Close this issue once the suite is green again; the next failure opens a fresh one."
            echo "While it stays open, further failures are added here as comments instead."
          } > e2e-failure.md
          gh issue create --title "E2E against staging is failing" --label e2e-red --body-file e2e-failure.md
